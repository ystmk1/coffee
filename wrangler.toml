name = "coffee"
main = "worker.js"
compatibility_date = "2026-09-01"
# https://coffee.<아이디>.workers.dev 주소를 켠다 (후원 QR이 이 주소를 쓴다).
workers_dev = true
# 대시보드에서 넣은 BANK 같은 일반 변수를 배포할 때 지우지 않는다.
keep_vars = true

# 계좌 정보는 여기 적지 말고 대시보드(Settings → Variables and Secrets)나 아래 명령으로 넣는다 (Git에 올라가지 않음):
#   npx wrangler secret put BANK
#   npx wrangler secret put ACCOUNT

# fetch 웹사이트 (헬퍼 설치 /helper/, 개인정보처리방침 /privacy/). fetch/build-store.mjs가 만든 dist/site를 여기에 복사한다.
# 파일이 없는 주소(/, /go, /coffee-qr.js)는 worker.js가 처리한다.
[assets]
directory = "./public"

# 피그마 플러그인 쿠폰의 짧은 코드 → 서명된 쿠폰 (coffee/license/license.mjs 가 등록한다)
[[kv_namespaces]]
binding = "COUPONS"
id = "122666b3ea204177b423ca22d8ed1a71"
